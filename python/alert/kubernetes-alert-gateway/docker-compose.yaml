services:
  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: kag:0.1.0

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy
    
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s