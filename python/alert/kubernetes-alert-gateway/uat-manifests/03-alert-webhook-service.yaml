apiVersion: v1
kind: Service
metadata:
  name: alert-webhook-service
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: kubernetes-webhook-alert
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-webhook-alert
    app.kubernetes.io/component: webhook-receiver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
