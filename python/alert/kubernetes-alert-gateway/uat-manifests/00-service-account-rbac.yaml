apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-webhook
  namespace: cattle-monitoring-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alert-webhook-read-alert-metadata
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alert-webhook-read-alert-metadata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alert-webhook-read-alert-metadata
subjects:
  - kind: ServiceAccount
    name: alert-webhook
    namespace: cattle-monitoring-system
