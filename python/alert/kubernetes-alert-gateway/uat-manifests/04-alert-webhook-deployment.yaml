apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: kubernetes-webhook-alert
    app.kubernetes.io/component: webhook-receiver
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-webhook-alert
      app.kubernetes.io/component: webhook-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-webhook-alert
        app.kubernetes.io/component: webhook-receiver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: alert-webhook
      imagePullSecrets:
        - name: uat-harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: webhook-server
          image: uat-harbor-lab.vnpost.vn/cloud-dept-alert/kubernetes-webhook-alert:uat-20261023-01
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: alert-webhook-config
            - secretRef:
                name: alert-webhook-secret
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alert-webhook-valkey-auth
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
